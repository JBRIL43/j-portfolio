<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300" role="img" aria-label="Protagonist working at a laptop">
  <g fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="150" cy="284" rx="96" ry="8" fill="#111" opacity="0.12" stroke="none"/>
    <!-- desk -->
    <path d="M40 252 h240" stroke-width="4"/>
    <path d="M64 252 v32 M256 252 v32" stroke-width="4"/>
    <!-- chair back -->
    <path d="M96 170 q-16 30 -14 78" stroke-width="4"/>
    <!-- legs seated -->
    <path d="M118 214 q34 6 54 38" stroke-width="4"/>
    <path d="M172 252 v26 M160 284 h28" stroke-width="4"/>
    <path d="M172 252 q-4 20 -12 32" stroke-width="4"/>
    <!-- torso leaning -->
    <path d="M110 138 q-6 44 4 78 q4 8 14 6 l30 -4 q8 -4 4 -12 q-14 -34 -12 -70 q-20 -6 -40 2z" fill="#fff" stroke-width="3.5"/>
    <path d="M134 148 l-4 42" stroke-width="2.5"/>
    <!-- arm to laptop -->
    <path d="M144 152 q34 20 52 54 q4 8 -4 10 q-8 2 -12 -6 q-16 -30 -44 -42" stroke-width="4"/>
    <!-- head -->
    <path d="M118 128 v8" stroke-width="3"/>
    <path d="M96 92 q0 -30 24 -30 q24 0 24 30 q0 28 -24 32 q-24 -4 -24 -32z" fill="#fff" stroke-width="3.5"/>
    <path d="M94 88 q2 -34 26 -34 q24 0 26 34 q-6 -14 -16 -16 q-4 8 -14 8 q-12 0 -14 -8 q-6 4 -8 16z" fill="#111" stroke-width="3"/>
    <!-- focused eyes looking down at screen -->
    <path d="M110 96 v3 M130 96 v3" stroke-width="4"/>
    <path d="M116 110 q6 2 12 -1" stroke-width="3"/>
    <!-- laptop -->
    <path d="M188 252 l14 -46 h58 l-6 46 z" fill="#fff" stroke-width="3.5"/>
    <path d="M204 214 h48" stroke-width="2.5"/>
    <path d="M210 224 h30 M210 234 h22" stroke-width="2" opacity="0.6"/>
    <!-- code brackets on screen -->
    <text x="230" y="246" font-family="monospace" font-size="13" fill="#111" text-anchor="middle" stroke="none">&lt;/&gt;</text>
    <text x="132" y="196" font-family="Georgia, serif" font-size="15" font-style="italic" font-weight="700" fill="#111" text-anchor="middle" stroke="none">J.</text>
  </g>
</svg>
