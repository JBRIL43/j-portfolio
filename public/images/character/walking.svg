<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="Protagonist walking">
  <g fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="120" cy="302" rx="56" ry="8" fill="#111" opacity="0.12" stroke="none"/>
    <!-- backpack -->
    <path d="M76 130 q-22 6 -22 36 q0 32 18 38 q10 3 16 -3 l0 -70 q-8 -4 -12 -1z" fill="#f4f4f5" stroke-width="3"/>
    <path d="M58 156 h16" stroke-width="2.5"/>
    <!-- legs mid-stride -->
    <path d="M110 212 q-16 34 -34 68" stroke-width="4"/>
    <path d="M134 212 q16 32 30 64" stroke-width="4"/>
    <path d="M64 284 l-6 8 M64 284 l10 6" stroke-width="5"/>
    <path d="M164 278 l10 4 M164 278 l-4 9" stroke-width="5"/>
    <!-- torso -->
    <path d="M100 128 q-10 44 -8 84 q0 6 8 6 h36 q8 0 8 -6 q0 -40 -8 -84 q-14 -8 -36 0z" fill="#fff" stroke-width="3.5"/>
    <path d="M120 134 v68" stroke-width="2"/>
    <path d="M104 130 l-4 44" stroke-width="2.5"/>
    <path d="M136 130 l4 44" stroke-width="2.5"/>
    <!-- arms swinging -->
    <path d="M100 134 q-18 26 -12 56 q2 8 9 5" stroke-width="4"/>
    <path d="M140 134 q18 28 12 56 q-2 8 -9 5" stroke-width="4"/>
    <!-- neck + head, looking ahead -->
    <path d="M114 116 v10 M126 116 v10" stroke-width="3"/>
    <path d="M98 78 q0 -30 24 -30 q24 0 24 30 q0 30 -24 34 q-24 -4 -24 -34z" fill="#fff" stroke-width="3.5"/>
    <path d="M96 74 q2 -34 26 -34 q24 0 26 34 q-6 -14 -16 -16 q-4 8 -14 8 q-12 0 -14 -8 q-6 4 -8 16z" fill="#111" stroke-width="3"/>
    <path d="M112 84 v4 M132 84 v4" stroke-width="4"/>
    <path d="M116 100 q7 4 13 -1" stroke-width="3"/>
    <!-- motion lines -->
    <path d="M44 150 h-14 M50 176 h-18 M46 202 h-12" stroke-width="2.5" opacity="0.5"/>
    <text x="120" y="176" font-family="Georgia, serif" font-size="16" font-style="italic" font-weight="700" fill="#111" text-anchor="middle" stroke="none">J.</text>
  </g>
</svg>
