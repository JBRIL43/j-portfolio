    <path d="M96 84 q-2 -38 24 -38 q26 0 24 38 q-4 -18 -14 -22 q-4 6 -10 6 q-14 0 -18 -10 q-6 8 -6 26z" fill="#111" stroke-width="3"/>
    <!-- receding path -->
    <path d="M108 300 q6 -30 12 -46 M132 300 q-4 -30 -8 -46" stroke-width="2" opacity="0.35" stroke-dasharray="4 7"/>
    <path d="M120 262 l0 -6" stroke-width="2" opacity="0.35"/>
  </g>
