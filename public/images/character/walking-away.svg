    <path d="M84 204 h72" stroke-width="2.5"/>
    <rect x="104" y="164" width="32" height="26" rx="3" stroke-width="3"/>
    <!-- J. embroidered on backpack -->
    <text x="120" y="185" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="700" fill="#111" text-anchor="middle" stroke="none">J.</text>
