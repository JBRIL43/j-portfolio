    <ellipse cx="120" cy="304" rx="50" ry="7" fill="#111" opacity="0.1" stroke="none"/>
    <!-- backpack from behind (prominent) -->
    <path d="M88 130 q-16 6 -16 40 q0 40 14 52 q10 8 34 8 q24 0 34 -8 q14 -12 14 -52 q0 -34 -16 -40 q-30 -10 -64 0z" fill="#f4f4f5" stroke-width="3.5"/>
